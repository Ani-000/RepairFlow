spring.application.name=repairflow

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repairflow}
spring.datasource.username=${DB_USERNAME:repairflow_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000